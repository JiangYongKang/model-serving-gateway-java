server.port=0

# 批量调度与过载控制
gateway.batch.max-batch-size=8
gateway.batch.batch-window-ms=20
gateway.batch.queue-capacity=64
gateway.batch.max-queue-wait-ms=200
gateway.batch.execution-timeout-ms=500

# 按版本容量治理（默认值；可用 gateway.capacity.versions.<版本>.<参数> 按版本覆盖）
gateway.capacity.failure-threshold=5
gateway.capacity.recovery-ms=5000
